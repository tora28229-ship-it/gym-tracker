<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ANYTIME 店舗トラッカー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-logo">
        <span class="brand-badge">AF</span>
        <h1>ANYTIME <span>TRACKER</span></h1>
      </div>
      <div class="home-selector-wrap">
        <label for="home-store-select" class="home-label">所属</label>
        <select id="home-store-select" class="home-select" aria-label="所属店舗">
          <option value="nagamineminami">長嶺南</option>
          <option value="kurokami">黒髪</option>
          <option value="higashimachi">東町</option>
          <option value="hakata3">博多三丁目</option>
          <option value="shinoe">新大江</option>
        </select>
      </div>
    </header>

    <!-- Compact Transfer Status Banner -->
    <section id="transfer-status-card" class="status-banner status-safe" aria-live="polite">
      <div class="status-left">
        <span id="status-icon" class="status-icon">✅</span>
        <div class="status-texts">
          <div id="status-title" class="status-title">安全（所属維持）</div>
          <div id="status-sub" class="status-sub">移籍対象外</div>
        </div>
      </div>
      <span id="status-action-pill" class="status-action-pill hidden"></span>
    </section>

    <!-- 1-Tap Check-in Card -->
    <section class="card checkin-card">
      <div class="checkin-header">
        <div>
          <span class="section-tag" id="selected-date-badge">TODAY</span>
          <h2 id="selected-date-title">今日の来店記録</h2>
        </div>
        <button type="button" id="back-to-today-btn" class="text-btn hidden">今日に戻る</button>
      </div>

      <div class="store-buttons" id="store-buttons">
        <button type="button" class="store-btn" data-store="nagamineminami">
          <span class="store-dot dot-nagamine"></span>
          <span class="store-name">長嶺南</span>
          <span class="home-mini-tag hidden">所属</span>
          <span class="store-check">✓</span>
        </button>
        <button type="button" class="store-btn" data-store="kurokami">
          <span class="store-dot dot-kurokami"></span>
          <span class="store-name">黒髪</span>
          <span class="home-mini-tag hidden">所属</span>
          <span class="store-check">✓</span>
        </button>
        <button type="button" class="store-btn" data-store="higashimachi">
          <span class="store-dot dot-higashi"></span>
          <span class="store-name">東町</span>
          <span class="home-mini-tag hidden">所属</span>
          <span class="store-check">✓</span>
        </button>
        <button type="button" class="store-btn" data-store="hakata3">
          <span class="store-dot dot-hakata3"></span>
          <span class="store-name">博多三丁目</span>
          <span class="home-mini-tag hidden">所属</span>
          <span class="store-check">✓</span>
        </button>
        <button type="button" class="store-btn" data-store="shinoe">
          <span class="store-dot dot-shinoe"></span>
          <span class="store-name">新大江</span>
          <span class="home-mini-tag hidden">所属</span>
          <span class="store-check">✓</span>
        </button>
      </div>
    </section>

    <!-- Stats & Donut Chart Card (with 30-day rolling block tabs) -->
    <section class="card stats-card">
      <div class="stats-top-row">
        <div>
          <h2 id="stats-heading">直近30日間の店舗割合</h2>
          <p class="stats-period" id="stats-period-label"></p>
        </div>
        <div class="total-visits-box">
          <span class="total-label">来店</span>
          <span class="total-count"><strong id="total-visits-count">0</strong><small>回</small></span>
        </div>
      </div>

      <!-- 30-Day Rolling Block Switcher -->
      <div class="block-tabs" role="tablist">
        <button type="button" class="block-tab active" data-block="0" role="tab">
          <span class="block-tab-dot" id="tab-dot-0"></span>直近30日
        </button>
        <button type="button" class="block-tab" data-block="1" role="tab">
          <span class="block-tab-dot" id="tab-dot-1"></span>30〜59日前
        </button>
        <button type="button" class="block-tab" data-block="2" role="tab">
          <span class="block-tab-dot" id="tab-dot-2"></span>60〜89日前
        </button>
      </div>

      <!-- Donut & Breakdown -->
      <div class="chart-area">
        <div class="donut-wrapper">
          <div class="donut-chart" id="donut-chart">
            <div class="donut-hole">
              <span class="donut-main-label" id="top-store-label">記録なし</span>
              <span class="donut-sub-label" id="top-store-pct">0%</span>
            </div>
          </div>
        </div>

        <div class="breakdown-list" id="breakdown-list">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Stacked horizontal bar with 51% line -->
      <div class="stacked-wrap">
        <div class="line-51" title="51%"><span>51%</span></div>
        <div class="stacked-bar-container" id="stacked-bar">
          <div class="stacked-empty">記録なし</div>
        </div>
      </div>
    </section>

    <!-- Interactive Calendar Card -->
    <section class="card calendar-card">
      <div class="calendar-header">
        <h2>カレンダー</h2>
        <div class="month-nav">
          <button type="button" id="prev-month-btn" class="nav-btn" aria-label="前月">‹</button>
          <span id="current-month-label" class="month-label"></span>
          <button type="button" id="next-month-btn" class="nav-btn" aria-label="翌月">›</button>
        </div>
      </div>

      <div class="calendar-weekdays">
        <span class="sun">日</span>
        <span>月</span>
        <span>火</span>
        <span>水</span>
        <span>木</span>
        <span>金</span>
        <span class="sat">土</span>
      </div>
      <div class="calendar-grid" id="calendar-grid">
        <!-- Populated by JS -->
      </div>

      <div class="calendar-legend">
        <span class="legend-item"><i class="store-dot dot-nagamine"></i>長嶺南</span>
        <span class="legend-item"><i class="store-dot dot-kurokami"></i>黒髪</span>
        <span class="legend-item"><i class="store-dot dot-higashi"></i>東町</span>
        <span class="legend-item"><i class="store-dot dot-hakata3"></i>博多三丁目</span>
        <span class="legend-item"><i class="store-dot dot-shinoe"></i>新大江</span>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
